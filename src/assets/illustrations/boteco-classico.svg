<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-label="Um gato, um cachorro, um axolote e uma lagartixa no boteco: dois discutem um livro tomando cerveja, os outros leem.">
  <style>
    .plastic { fill: #e2ad22; }
    .plastic-shade { fill: #c8951b; }
    .ink { fill: #1d1d20; }
    .line { fill: none; stroke: #1d1d20; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
    * { transform-box: view-box; }
    @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
    @keyframes sway { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
    @keyframes wag { from { transform: rotate(-14deg); } to { transform: rotate(12deg); } }
    @keyframes flick { 0%, 84%, 100% { transform: rotate(0); } 90% { transform: rotate(-12deg); } }
    @keyframes gesture { 0%, 100% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(1px, -4px) rotate(-8deg); } }
    @keyframes nod { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.2px); } }
    @keyframes gills { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
    @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.18); } }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 5.2s infinite; }
    .eye.b { animation-delay: 1.7s; }
    .eye.c { animation-delay: 3.1s; }
    .eye.d { animation-delay: 0.6s; animation-duration: 6.4s; }
    .cat-tail { transform-origin: 92px 120px; animation: sway 3.4s ease-in-out infinite alternate; }
    .dog-ear { transform-origin: 148px 51px; animation: flick 4.6s infinite; }
    .dog-paw { transform-origin: 174px 90px; animation: gesture 1.3s ease-in-out infinite; }
    .dog-head { animation: nod 1.3s ease-in-out infinite; }
    .dog-tail { transform-origin: 140px 96px; animation: wag 0.45s ease-in-out infinite alternate; }
    .gills-l { transform-origin: 200px 64px; animation: gills 1.8s ease-in-out infinite alternate; }
    .gills-r { transform-origin: 228px 64px; animation: gills 1.8s ease-in-out infinite alternate-reverse; }
    .gecko-tail { transform-origin: 313px 82px; animation: sway 4.2s ease-in-out infinite alternate; }
    .foam { transform-box: fill-box; transform-origin: bottom; animation: breathe 2.6s ease-in-out infinite; }
    @keyframes talk { 0%, 42% { opacity: 1; transform: scale(1); } 48%, 94% { opacity: 0; transform: scale(.6); } 100% { opacity: 1; transform: scale(1); } }
    .bubble { transform-box: fill-box; animation: talk 3.6s ease-in-out infinite; }
    .bubble.a { transform-origin: 30% 100%; }
    .bubble.b { transform-origin: 70% 100%; animation-delay: -1.8s; }
    .bulb { animation: twinkle 3s ease-in-out infinite; }
    .bulb:nth-child(2n) { animation-delay: 1.1s; }
    .bulb:nth-child(3n) { animation-delay: 2s; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- string lights -->
  <path d="M6 14 Q 180 46 354 10" fill="none" stroke="#8c8a84" stroke-width="0.8" />
  <g fill="#f3cf6b">
    <circle class="bulb" cx="40" cy="22" r="2.6" /><circle class="bulb" cx="80" cy="29" r="2.6" />
    <circle class="bulb" cx="120" cy="33" r="2.6" /><circle class="bulb" cx="160" cy="35" r="2.6" />
    <circle class="bulb" cx="200" cy="34" r="2.6" /><circle class="bulb" cx="240" cy="31" r="2.6" />
    <circle class="bulb" cx="280" cy="25" r="2.6" /><circle class="bulb" cx="320" cy="17" r="2.6" />
  </g>

  <!-- floor -->
  <path d="M8 170 H352" stroke="#cfccc4" stroke-width="1.2" />

  <!-- ── Left chair, front view, with the cat reading ── -->
  <rect class="plastic-shade" x="50" y="62" width="48" height="58" rx="10" />
  <g fill="#e9bd45"><rect x="56" y="70" width="36" height="3" rx="1.5" /><rect x="56" y="76" width="36" height="3" rx="1.5" /></g>
  <g class="cat-tail"><path d="M90 120 C 106 121, 110 136, 100 143 C 97 145, 95 143, 97 141" fill="none" stroke="#a19a90" stroke-width="5" stroke-linecap="round" /></g>
  <ellipse cx="74" cy="104" rx="18" ry="16" fill="#a19a90" />
  <circle cx="74" cy="80" r="14" fill="#a19a90" />
  <path d="M62.5 73 L61.5 60 L71 68.5 Z M85.5 73 L86.5 60 L77 68.5 Z" fill="#a19a90" />
  <path d="M64 70 L63.6 64.5 L67.5 68 Z M84 70 L84.4 64.5 L80.5 68 Z" fill="#e9a9a2" />
  <path class="line eye" d="M67.5 81.5 q 2.5 2 5 0" />
  <path class="line eye b" d="M75.5 81.5 q 2.5 2 5 0" />
  <circle cx="74" cy="86" r="1.3" fill="#d98a86" />
  <!-- book seen from the back cover -->
  <path d="M59 97 L74 102 L89 97 L89 113 L74 118 L59 113 Z" fill="#233a72" />
  <path d="M74 102 V118" stroke="#16264d" stroke-width="1.2" />
  <ellipse cx="60" cy="105" rx="4.5" ry="3.6" fill="#b2aba1" /><ellipse cx="88" cy="105" rx="4.5" ry="3.6" fill="#b2aba1" />
  <!-- seat, arms and legs -->
  <rect class="plastic" x="44" y="117" width="60" height="9" rx="3.5" />
  <path d="M46 120 C 42 104, 46 96, 56 95" fill="none" stroke="#e2ad22" stroke-width="5" stroke-linecap="round" />
  <path d="M102 120 C 106 104, 102 96, 92 95" fill="none" stroke="#e2ad22" stroke-width="5" stroke-linecap="round" />
  <path class="plastic-shade" d="M49 126 L58 126 L55 170 L46 170 Z M90 126 L99 126 L102 170 L93 170 Z" />

  <!-- ── Table with dog and axolotl arguing ── -->
  <!-- dog -->
  <g class="dog-tail"><path d="M142 98 q -9 -4 -11 -13" fill="none" stroke="#c8925c" stroke-width="4.5" stroke-linecap="round" /></g>
  <rect x="140" y="74" width="36" height="40" rx="15" fill="#c8925c" />
  <g class="dog-paw">
    <path d="M172 90 Q 182 88 186 76" fill="none" stroke="#c8925c" stroke-width="6.5" stroke-linecap="round" />
    <ellipse cx="187" cy="73.5" rx="4.6" ry="4" fill="#d6a673" />
  </g>
  <g class="dog-head">
    <circle cx="158" cy="60" r="15" fill="#c8925c" />
    <ellipse cx="169.5" cy="64.5" rx="8.5" ry="6.2" fill="#e3bd8f" />
    <circle cx="177" cy="62.4" r="2.5" class="ink" />
    <path d="M167 69.6 q 4.5 5 9 0 Z" fill="#1d1d20" /><path d="M169.5 71.4 q 2 1.6 4 0" fill="#e07a7a" />
    <circle class="eye c" cx="163" cy="55.5" r="1.9" fill="#1d1d20" />
    <g class="dog-ear"><path d="M148 49 C 138 51, 137 67, 143.5 73 C 149 69, 152 58, 148 49 Z" fill="#94643a" /></g>
  </g>
  <!-- axolotl -->
  <rect x="198" y="78" width="34" height="34" rx="15" fill="#f3b0c0" />
  <g class="gills-l" fill="none" stroke="#e5718d" stroke-width="4" stroke-linecap="round">
    <path d="M200 58 q -9 -7 -13 -3" /><path d="M199 64 q -10 -2 -14 3" /><path d="M200 70 q -8 3 -10 9" />
  </g>
  <g class="gills-r" fill="none" stroke="#e5718d" stroke-width="4" stroke-linecap="round">
    <path d="M228 58 q 9 -7 13 -3" /><path d="M229 64 q 10 -2 14 3" /><path d="M228 70 q 8 3 10 9" />
  </g>
  <ellipse cx="214" cy="66" rx="17" ry="13" fill="#f3b0c0" />
  <circle class="eye d" cx="206" cy="64" r="1.9" fill="#1d1d20" />
  <circle class="eye d" cx="217" cy="64" r="1.9" fill="#1d1d20" />
  <path class="line" d="M206 71 q 5 3.6 10 0" />
  <ellipse cx="203" cy="70" rx="2.6" ry="1.4" fill="#ef8fa5" opacity="0.7" />
  <path d="M229 95 Q 234 97 236 93" fill="none" stroke="#f3b0c0" stroke-width="6" stroke-linecap="round" />
  <!-- table -->
  <rect class="plastic" x="112" y="102" width="152" height="9" rx="3.5" />
  <rect class="plastic-shade" x="116" y="111" width="144" height="4" rx="1" />
  <path class="plastic-shade" d="M119 115 L130 115 L126 170 L114 170 Z M246 115 L257 115 L262 170 L250 170 Z" />
  <!-- on the table: book, glasses, bottle, peanuts -->
  <rect x="120" y="96" width="24" height="6" rx="1" fill="#2c7a4b" />
  <rect x="122" y="97.5" width="21" height="1.6" fill="#f6f3ea" />
  <g>
    <path d="M147 85 L159 85 L157.4 102 L148.6 102 Z" fill="#ffffff" opacity="0.55" />
    <path d="M148 91 L158 91 L157 102 L149 102 Z" fill="#d08c2e" />
    <path class="foam" d="M147.6 87.5 L158.4 87.5 L158 91.2 L148 91.2 Z" fill="#fbf6e8" />
    <path d="M151 92 V101 M154 92 V101" stroke="#b77420" stroke-width="0.6" />
  </g>
  <g>
    <rect x="249" y="64" width="13" height="38" rx="3.5" fill="#5a3a1f" />
    <rect x="252.5" y="49" width="6" height="17" rx="2" fill="#5a3a1f" />
    <rect x="252" y="46.5" width="7" height="3.5" rx="1" fill="#b9b4a8" />
    <rect x="252.5" y="55" width="6" height="2.6" fill="#e9dfc8" />
    <rect x="250.5" y="77" width="10" height="13" rx="2.5" fill="#e9dfc8" />
  </g>
  <g>
    <path d="M233 85 L245 85 L243.4 102 L234.6 102 Z" fill="#ffffff" opacity="0.55" />
    <path d="M234 92 L244 92 L243 102 L235 102 Z" fill="#d08c2e" />
    <path class="foam" d="M233.6 88.5 L244.4 88.5 L244 92.2 L234 92.2 Z" fill="#fbf6e8" />
    <path d="M237 93 V101 M240 93 V101" stroke="#b77420" stroke-width="0.6" />
  </g>
  <ellipse cx="208" cy="101" rx="10" ry="2.4" fill="#ffffff" stroke="#d8d4ca" stroke-width="0.8" />
  <g fill="#c79a5c"><ellipse cx="204" cy="99.6" rx="2" ry="1.2" /><ellipse cx="208.5" cy="99.2" rx="2" ry="1.2" /><ellipse cx="212.5" cy="99.8" rx="2" ry="1.2" /></g>


  <!-- alternating speech bubbles: the argument -->
  <g class="bubble a">
    <path d="M176 28 h20 a5 5 0 0 1 5 5 v9 a5 5 0 0 1 -5 5 h-12 l-5 5 v-5 h-3 a5 5 0 0 1 -5 -5 v-9 a5 5 0 0 1 5 -5 Z" fill="#ffffff" stroke="#1d1d20" stroke-width="1.1" />
    <path d="M186 32.5 v6.5" stroke="#1d1d20" stroke-width="2.2" stroke-linecap="round" /><circle cx="186" cy="42.6" r="1.2" fill="#1d1d20" />
  </g>
  <g class="bubble b">
    <path d="M226 26 h20 a5 5 0 0 1 5 5 v9 a5 5 0 0 1 -5 5 h-3 v5 l-5 -5 h-12 a5 5 0 0 1 -5 -5 v-9 a5 5 0 0 1 5 -5 Z" fill="#ffffff" stroke="#1d1d20" stroke-width="1.1" />
    <path d="M232.6 32.4 q 3.4 -3 6.8 0 q 1 2.6 -3.4 4.4 v1.6" fill="none" stroke="#1d1d20" stroke-width="1.8" stroke-linecap="round" /><circle cx="236" cy="41.6" r="1.1" fill="#1d1d20" />
  </g>
  <!-- ── Right chair seen from the back, gecko reading on top ── -->
  <rect class="plastic" x="280" y="86" width="56" height="60" rx="10" />
  <g class="plastic-shade"><rect x="288" y="94" width="40" height="3.2" rx="1.6" /><rect x="288" y="100" width="40" height="3.2" rx="1.6" /><rect x="288" y="106" width="40" height="3.2" rx="1.6" /></g>
  <!-- the red refresh mark -->
  <g fill="none" stroke="#c8372d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M316.5 123.5 A 8.5 8.5 0 1 1 312.5 116.2" />
    <path d="M311 111.6 L313.3 116.6 L308.2 118.4" />
  </g>
  <rect class="plastic-shade" x="276" y="142" width="64" height="7" rx="3" />
  <path class="plastic-shade" d="M282 149 L290 149 L287 170 L279 170 Z M326 149 L334 149 L337 170 L329 170 Z" />
  <!-- gecko, perched on the backrest, reading -->
  <g class="gecko-tail"><path d="M313 82 C 328 84, 334 98, 329 111 C 327 115, 324 115, 325 112" fill="none" stroke="#e4c8a6" stroke-width="3.8" stroke-linecap="round" /></g>
  <ellipse cx="306" cy="73" rx="9" ry="13" fill="#e4c8a6" />
  <g stroke="#e4c8a6" stroke-width="3" stroke-linecap="round"><path d="M299 83 l -4 3" /><path d="M313 83 l 4 3" /></g>
  <g fill="#d3b18a"><circle cx="293.4" cy="86.4" r="1.5" /><circle cx="295.8" cy="87.4" r="1.5" /><circle cx="316.2" cy="87.4" r="1.5" /><circle cx="318.6" cy="86.4" r="1.5" /></g>
  <ellipse cx="306" cy="55" rx="10" ry="7.5" fill="#e4c8a6" />
  <g fill="#d3b18a"><circle cx="303" cy="50" r="1" /><circle cx="309.5" cy="49.5" r="1" /><circle cx="306" cy="47.6" r="0.9" /></g>
  <circle cx="298.6" cy="53" r="3" fill="#e4c8a6" /><circle cx="313.4" cy="53" r="3" fill="#e4c8a6" />
  <circle class="eye b" cx="298.6" cy="53" r="2" fill="#1d1d20" />
  <circle class="eye b" cx="313.4" cy="53" r="2" fill="#1d1d20" />
  <circle cx="298" cy="52.3" r="0.6" fill="#ffffff" /><circle cx="312.8" cy="52.3" r="0.6" fill="#ffffff" />
  <path class="line" d="M302 58.6 q 4 2.4 8 0" />
  <!-- open book, back cover towards us -->
  <path d="M295 64 L306 68 L317 64 L317 77 L306 81 L295 77 Z" fill="#2c7a4b" />
  <path d="M306 68 V81" stroke="#1e5a37" stroke-width="1.1" />
  <g fill="#e4c8a6"><circle cx="295.6" cy="70.5" r="2.4" /><circle cx="316.4" cy="70.5" r="2.4" /></g>
  <g fill="#d3b18a"><circle cx="293.6" cy="69.4" r="1" /><circle cx="293.4" cy="71.8" r="1" /><circle cx="318.4" cy="69.4" r="1" /><circle cx="318.6" cy="71.8" r="1" /></g>
</svg>
