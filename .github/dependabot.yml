# Weekly update proposals for npm packages and for the pinned GitHub Actions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A freshly published version waits a week: compromised releases are
    # usually caught and pulled within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A freshly published version waits a week: compromised releases are
    # usually caught and pulled within days.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
